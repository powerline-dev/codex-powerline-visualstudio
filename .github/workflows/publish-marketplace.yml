name: Publish Visual Studio extension

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built VSIX package to Visual Studio Marketplace
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.build.outputs.version }}
      publish: ${{ steps.build.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Build and test the release VSIX
        id: build
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $publish = $env:PUBLISH_REQUESTED -eq 'true'
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:BEFORE_SHA -notmatch '^0+$') {
            $previousPackage = git show "$($env:BEFORE_SHA):package.json"
            if ($LASTEXITCODE -ne 0) { throw 'Could not read the version before this push.' }
            $previousVersion = ($previousPackage | Out-String | ConvertFrom-Json).version
            if (!$version -or !$previousVersion) { throw 'Missing extension version.' }
            $publish = [version]$version -gt [version]$previousVersion
          }
          ./scripts/build.ps1 -Release
          "folder=releases/$version" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          name: visual-studio-vsix
          path: |
            ${{ steps.build.outputs.folder }}/codex-powerline-visualstudio-*.vsix
            ${{ steps.build.outputs.folder }}/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: needs.package.outputs.publish == 'true' && github.repository == 'powerline-dev/codex-powerline-visualstudio' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: windows-2025
    environment: marketplace-release
    concurrency:
      group: marketplace-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: visual-studio-vsix
          path: artifacts
      - name: Publish to Visual Studio Marketplace
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: ./scripts/publish-marketplace.ps1 -Version $env:RELEASE_VERSION
